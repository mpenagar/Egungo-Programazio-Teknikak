<svg viewBox="0 0 800 800" width="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: white; font-family: sans-serif;">
  <!-- Ardatzak eta banaketa -->
  <line x1="400" y1="0" x2="400" y2="800" stroke="#e0e0e0" stroke-width="3"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#e0e0e0" stroke-width="3"/>

  <!-- Goiburuko testuak -->
  <text x="200" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#333">Bariantza Txikia</text>
  <text x="600" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#333">Bariantza Handia</text>
  
  <text x="-200" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#333" transform="rotate(-90)">Alborapen Txikia</text>
  <text x="-600" y="40" font-size="22" text-anchor="middle" font-weight="bold" fill="#333" transform="rotate(-90)">Alborapen Handia</text>

  <!-- Dianen diseinua eta dardoak (zirkulu gorriak) -->
  <defs>
    <g id="diana">
      <circle cx="0" cy="0" r="110" fill="#f8f9fa" stroke="#ced4da" stroke-width="2"/>
      <circle cx="0" cy="0" r="75" fill="#e9ecef" stroke="#ced4da" stroke-width="2"/>
      <circle cx="0" cy="0" r="40" fill="#dee2e6" stroke="#ced4da" stroke-width="2"/>
      <circle cx="0" cy="0" r="15" fill="#e74c3c"/>
    </g>
    <circle id="dardo" cx="0" cy="0" r="6" fill="#2c3e50" opacity="0.9"/>
  </defs>

  <!-- 1. Koadrantea: Alborapen Txikia, Bariantza Txikia -->
  <g transform="translate(200, 210)">
    <use href="#diana"/>
    <use href="#dardo" x="-5" y="8" />
    <use href="#dardo" x="10" y="-4" />
    <use href="#dardo" x="-10" y="-12" />
    <use href="#dardo" x="8" y="12" />
    <use href="#dardo" x="3" y="-5" />
    <text x="0" y="160" font-size="18" text-anchor="middle" font-weight="bold" fill="#27ae60">Helburu Ideala (Zehatza)</text>
  </g>

  <!-- 2. Koadrantea: Alborapen Txikia, Bariantza Handia -->
  <g transform="translate(600, 210)">
    <use href="#diana"/>
    <use href="#dardo" x="-45" y="55" />
    <use href="#dardo" x="65" y="-25" />
    <use href="#dardo" x="-15" y="-80" />
    <use href="#dardo" x="70" y="45" />
    <use href="#dardo" x="-65" y="-15" />
    <text x="0" y="160" font-size="18" text-anchor="middle" font-weight="bold" fill="#e67e22">Gaindoikuntza (Overfitting)</text>
  </g>

  <!-- 3. Koadrantea: Alborapen Handia, Bariantza Txikia -->
  <g transform="translate(200, 610)">
    <use href="#diana"/>
    <use href="#dardo" x="65" y="-55" />
    <use href="#dardo" x="80" y="-70" />
    <use href="#dardo" x="60" y="-80" />
    <use href="#dardo" x="85" y="-50" />
    <use href="#dardo" x="70" y="-65" />
    <text x="0" y="160" font-size="18" text-anchor="middle" font-weight="bold" fill="#e67e22">Azpidoikuntza (Underfitting)</text>
  </g>

  <!-- 4. Koadrantea: Alborapen Handia, Bariantza Handia -->
  <g transform="translate(600, 610)">
    <use href="#diana"/>
    <use href="#dardo" x="35" y="-80" />
    <use href="#dardo" x="100" y="-15" />
    <use href="#dardo" x="75" y="-110" />
    <use href="#dardo" x="120" y="-65" />
    <use href="#dardo" x="15" y="-35" />
    <text x="0" y="160" font-size="18" text-anchor="middle" font-weight="bold" fill="#c0392b">Eredu Erabiltezina</text>
  </g>
</svg>
